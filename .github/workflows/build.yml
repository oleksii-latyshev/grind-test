name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the running build irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A `.gitignore` pattern without a slash matches at any depth, which is how the whole
      # `src-tauri/src/vault/` module stayed out of every commit while the app built fine
      # locally. Checking that each declared module resolves costs a second and fails here
      # rather than after two platforms have installed a Rust toolchain.
      - name: Every declared Rust module is committed
        run: |
          missing=0
          for module in $(sed -n 's/^pub mod \([a-z_]*\);/\1/p' src-tauri/src/lib.rs); do
            if [ ! -f "src-tauri/src/$module.rs" ] && [ ! -f "src-tauri/src/$module/mod.rs" ]; then
              echo "::error file=src-tauri/src/lib.rs::module '$module' is declared but not in the repository — check .gitignore"
              missing=1
            fi
          done
          exit $missing

      # Biome holds TypeScript to 300 lines a file (`noExcessiveLinesPerFile`). Rust is out of
      # its reach, so the same limit is checked here — before any toolchain is installed.
      - name: No Rust file over 300 lines
        run: |
          find src-tauri/src src-tauri/grind-cli/src src-tauri/tests -name '*.rs' -exec wc -l {} + \
            | awk '$2 != "total" && $1 > 300 { print "::error file=" $2 "::" $1 " lines; the limit is 300 (CODE_REQUIREMENTS.md §1)"; failed = 1 } END { exit failed }'

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      # `bun run build` is `tsc && vite build`, so this is the type check too. It needs no
      # Rust toolchain, which makes it the fastest signal on a broken commit.
      - run: bun run build

  # Its own job: rustfmt needs no dependencies and no build, so this answers in seconds instead
  # of waiting behind the platform builds.
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all --check

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7

  app:
    needs: frontend
    uses: ./.github/workflows/app-build.yml
