# The packaging matrix, called by both `build` (every push) and `release` (every tag), so
# what a release ships is byte-for-byte the process CI already exercises.
name: app-build

on:
  workflow_call:
    inputs:
      retention-days:
        description: How long to keep the uploaded artifacts.
        type: number
        default: 14

jobs:
  app:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One `universal-apple-darwin` build rather than a runner per architecture: GitHub
          # retired the `macos-13` Intel image, and this build compiles both slices anyway —
          # which is also what lets the leg ship an arm64-only image without building twice.
          - label: macOS
            os: macos-latest
            rust-target: universal-apple-darwin
            toolchain-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - label: Windows
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            toolchain-targets: x86_64-pc-windows-msvc
            artifact: grind-test-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.toolchain-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - name: Rust tests
        working-directory: src-tauri
        # `--tests` adds `tests/`, where the pipeline runs end to end against a fake `agy`.
        run: cargo test --tests

      - name: Build the app
        run: bun run tauri build --target ${{ matrix.rust-target }}

      # Two images from the one build. Most Macs are Apple Silicon and should not have to
      # download an Intel slice they will never run; the universal image stays for Intel
      # machines and for anyone who does not want to know which they have.
      #
      # The arm64 image is `lipo -thin`-ed out of the universal binary, so it *is* the
      # arm64 build rather than a second compile of it. Thinning would invalidate a code
      # signature — these builds are unsigned, so there is none to break.
      #
      # A disk image also preserves the bundle's executable bit, which `upload-artifact`
      # strips from a bare `.app`. Built with `hdiutil` rather than Tauri's dmg bundler,
      # which drives Finder over AppleScript purely to lay the window out prettily and dies
      # with "Not authorised to send Apple events to Finder (-1743)" on any machine without
      # Automation permission — CI included.
      - name: Bundle the macOS disk images
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app="src-tauri/target/${{ matrix.rust-target }}/release/bundle/macos/grind-test.app"

          # make_dmg <output.dmg> [arch-to-keep]
          make_dmg() {
            stage="$(mktemp -d)"
            cp -R "$app" "$stage/"
            ln -s /Applications "$stage/Applications"
            if [ "$#" -ge 2 ]; then
              bin="$stage/grind-test.app/Contents/MacOS/grind-test"
              lipo -thin "$2" "$bin" -output "$bin.thin"
              mv "$bin.thin" "$bin"
            fi
            hdiutil create -volname grind-test -srcfolder "$stage" -ov -format UDZO "$1"
            hdiutil verify "$1"
            rm -rf "$stage"
          }

          make_dmg grind-test-macos-arm64.dmg arm64
          make_dmg grind-test-macos-universal.dmg

          # A wrong slice is an image that refuses to launch on half the Macs it is offered
          # to, and nothing downstream would notice — so assert what actually landed in
          # each one, not just that the files exist.
          slices() {
            mount="$(mktemp -d)"
            hdiutil attach "$1" -nobrowse -readonly -mountpoint "$mount" > /dev/null
            lipo -archs "$mount/grind-test.app/Contents/MacOS/grind-test" \
              | tr ' ' '\n' | sort | paste -sd, -
            hdiutil detach "$mount" -quiet
          }
          arm="$(slices grind-test-macos-arm64.dmg)"
          universal="$(slices grind-test-macos-universal.dmg)"
          echo "arm64 image: $arm | universal image: $universal"
          test "$arm" = arm64
          test "$universal" = arm64,x86_64

      - name: Upload the Apple Silicon image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: grind-test-macos-arm64
          path: grind-test-macos-arm64.dmg
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

      - name: Upload the universal image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: grind-test-macos-universal
          path: grind-test-macos-universal.dmg
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.rust-target }}/release/bundle/nsis/*-setup.exe
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
